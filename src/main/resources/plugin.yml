name: speedcubingServer
main: top.speedcubing.server.speedcubingServer
version: ${plugin.report.version}
commands:
  premium:
    usage: /premium
  resetpassword:
    usage: /resetpassword
  discord:
    usage: /discord
  cpsdisplay:
    usage: /cpsdisplay
  skin:
    usage: /skin
  fly:
    usage: /fly
  hub:
    usage: /hub
    aliases:
      - leave
      - l
      - lobby
      - quit
  announce:
    usage: /announce
  nick:
    usage: /nick
  unnick:
    usage: /unnick
  testkb:
    usage: /testkb
  kaboom:
    usage: /kaboom
  deepfry:
    usage: /deepfry
  freeze:
    usage: /freeze
  2fa:
    usage: /2fa
  image:
    aliases: [ i ]
    usage: /image
  history:
    usage: /history
  getitemtype:
    usage: /getitemtype
  sendpacket:
    usage: /sendpacket
  status:
    usage: /status
  bangift:
    usage: /bangift
  ranks:
    usage: /ranks
  music:
    usage: /music
  cps:
    usage: /cps <player>

permissions:
  speedcubing.command.server.announce:
    default: op
  speedcubing.command.server.bangift:
    default: op
  speedcubing.command.server.cps:
    default: op
  speedcubing.command.server.cpsdisplay:
    default: op
  speedcubing.command.server.deepfry:
    default: op
  speedcubing.command.server.freeze:
    default: op
  speedcubing.command.server.getitemtype:
    default: op
  speedcubing.command.server.heal:
    default: op
  speedcubing.command.server.history:
    default: op
  speedcubing.command.server.image:
    default: op
  speedcubing.command.server.kaboom:
    default: op
  speedcubing.command.server.music:
    default: op
  speedcubing.command.server.nicklogs:
    default: op
  speedcubing.command.server.sendpacket:
    default: op
  speedcubing.command.server.serverconfig:
    default: op
  speedcubing.command.server.testkb:
    default: op

depend:
  - speedcubingLib
  - LuckPerms
